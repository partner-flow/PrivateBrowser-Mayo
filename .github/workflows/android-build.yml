name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you start it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Installs Gradle 8.7 (the version this project targets, compatible with AGP 8.5.2)
      # and caches Gradle dependencies safely between runs.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The repository ships gradlew/gradlew.bat/gradle-wrapper.properties but not the binary
      # wrapper jar. If it is missing, Gradle itself generates the real one here.
      - name: Generate Gradle wrapper if the wrapper JAR is missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing - generating with Gradle 8.7"
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -l app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: private-browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
